# Настройки pnpm 11 (поле `pnpm` в package.json больше не читается).
# allowBuilds — какие пакеты могут запускать свои install-скрипты.
# minimumReleaseAge — 0, иначе свежие версии откладываются в node_modules/.ignored_*.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 0
