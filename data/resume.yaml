agentic:
  heading: Разработка с AI-агентами
  lead: >-
    Агент — не замена инженеру, а исполнитель внутри процесса, у которого есть
    правила, план, проверки и ревью. Именно так собран этот сайт и инструмент
    поиска вакансий.
  items:
    - title: Правила вместо надежды
      text: >-
        Веду собственный набор правил для Cursor и DS Harness: класс задачи,
        brief, план, волны исполнения, проверка. AGENTS.md и скиллы генерируются
        из .cursor/rules, рассинхрон ловит CI.
    - title: Проверки как контракт
      text: >-
        pnpm verify = линты + типы + тесты, pre-push не пропускает красное.
        У каждого проекта есть команда, которая одной строкой отвечает на вопрос
        «это можно выкатывать».
    - title: Агент делает, человек решает
      text: >-
        Продуктовые и архитектурные решения остаются за мной; агент разбирает
        код, готовит варианты, пишет тесты и доводит задачу до зелёных проверок.
        Ревью — другим инструментом, чтобы ошибки не воспроизводились дважды.

